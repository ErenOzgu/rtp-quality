name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create from the selected commit, e.g. v0.1.0"
        required: true
        type: string

env:
  # A tag push gives the version in the ref name; a manual run gives it as an input.
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    name: Binaries and GitHub release
    runs-on: ubuntu-24.04
    steps:
      - name: Check version format
        run: |
          [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'${VERSION}' is not a vX.Y.Z tag"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: Test
        run: go test ./... -count=1
      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            name="rtp-quality-${VERSION}.${os}-${arch}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            mkdir -p "dist/${name}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" -o "dist/${name}/rtp-quality${ext}" ./cmd/rtp-quality
            cp LICENSE README.md "dist/${name}/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "${name}.zip" "${name}")
            else
              tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            fi
            rm -rf "dist/${name}"
          done
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --target is only used when the tag does not exist yet (manual run).
          gh release create "${VERSION}" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --target "${GITHUB_SHA}" --title "${VERSION}" --generate-notes
